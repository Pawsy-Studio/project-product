services:
  postgres:
    image: postgres:15-alpine
    container_name: freedraw_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freedraw_db}
      POSTGRES_USER: ${POSTGRES_USER:-freedraw_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - freedraw_network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: freedraw_backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-freedraw_user}:${POSTGRES_PASSWORD:-changeme123}@postgres:5432/${POSTGRES_DB:-freedraw_db}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-me}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - freedraw_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: freedraw_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - freedraw_network
    restart: unless-stopped

networks:
  freedraw_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local